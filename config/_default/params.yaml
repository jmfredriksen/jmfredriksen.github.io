    language_switcher: false
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: chicago
  search:
    enable: true
  locale: {}
  privacy:
    enable: false
